name: Daily encrypted Supabase backup

on:
  schedule:
    # GitHub cron is UTC. 15:00 UTC = 00:00 KST (Asia/Seoul) next day.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create database backup with PostgreSQL 17
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PGPASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)
          mkdir -p backup
          filename="family-college-planner-$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"
          docker run --rm \
            -e PGPASSWORD="$PGPASSWORD" \
            -e PGSSLMODE=require \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_dump \
              -h aws-0-ap-northeast-1.pooler.supabase.com \
              -p 5432 \
              -U postgres.udyurqsoxwxypymrhfss \
              -d postgres \
              --format=custom \
              --no-owner \
              --no-privileges \
              --file="/backup/$filename"

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSWORD" || (echo "Missing BACKUP_ENCRYPTION_PASSWORD secret" && exit 1)
          file=$(find backup -name '*.dump' -type f | head -n 1)
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$file" -out "$file.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          rm -f "$file"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/*.enc
          if-no-files-found: error
          retention-days: 90
